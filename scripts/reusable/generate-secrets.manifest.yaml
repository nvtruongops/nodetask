id: script-generate-secrets
name: Automated Strong Hash & Secret Generator
type: reusable
purpose: >
  Generates cryptographically secure high-entropy hashes and passwords
  for all self-hosted services (PostgreSQL, Redis, MinIO, Serverpod Service Secret, JWT),
  automatically synchronizing root .env and apps/server/config/passwords.yaml.

reuse:
  expected: true
  scope: repository
  deterministic: false

inputs:
  - name: force
    source: cli
    required: false
    description: "Force overwrite existing secrets in .env and passwords.yaml"
  - name: dry-run
    source: cli
    required: false
    description: "Display generated secrets in console without modifying files"
  - name: length
    source: cli
    required: false
    description: "Custom byte length for generated entropy (default: 32 bytes / 256-bit)"

secrets:
  allowed: false

filesystem:
  absolute_paths_allowed: false

network:
  allowed: false

destructive:
  allowed: false

lifecycle:
  owner: security-governance
  retention: permanent

evidence:
  required: false
