services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: todo_postgres
    restart: always
    environment:
      POSTGRES_DB: todo_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: todo_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"  # S3 API Endpoint
      - "9001:9001"  # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc:latest
    container_name: todo_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin miniopassword;

        # 1. Khởi tạo 4 phân vùng Buckets chuẩn
        mc mb --ignore-existing local/nodetask-uploads;
        mc mb --ignore-existing local/nodetask-attachments;
        mc mb --ignore-existing local/nodetask-avatars;
        mc mb --ignore-existing local/nodetask-exports;

        # 2. Cấu hình Quyền Tải Công Khai (Anonymous Public Download) cho Uploads và Avatars
        mc anonymous set download local/nodetask-avatars;
        mc anonymous set download local/nodetask-uploads;

        # 3. Cấu hình Vòng đời Tự động Hủy sau 7 ngày (ILM 7-Day Auto Purge) cho nodetask-exports
        mc ilm rule add --expire-days 7 local/nodetask-exports || true;

        # 4. Khởi tạo IAM Policy & Service Account chuyên dụng cho Backend Application
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::nodetask-*"]}]}' > /tmp/app-policy.json;
        mc admin policy create local nodetask-app-policy /tmp/app-policy.json || true;
        mc admin user add local nodetask_app nodetask_app_secret || true;
        mc admin policy attach local nodetask-app-policy --user nodetask_app || true;

        echo "MinIO init completed successfully!";
        exit 0;

volumes:
  postgres_data:
  redis_data:
  minio_data:
