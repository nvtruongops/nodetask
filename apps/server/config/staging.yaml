# ==============================================================================
# Serverpod Staging Configuration (staging.yaml)
# Staging / CI-CD QA environment settings
# ==============================================================================

apiServer:
  port: 8080
  publicHost: staging-api.nodetask.io
  publicPort: 443
  publicScheme: https

webServer:
  port: 8082
  publicHost: staging-app.nodetask.io
  publicPort: 443
  publicScheme: https

insightsServer:
  port: 8081
  publicHost: staging-insights.nodetask.io
  publicPort: 8081
  publicScheme: https

database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  name: ${POSTGRES_DB}
  user: ${POSTGRES_USER}

redis:
  enabled: true
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  user: default

logging:
  logLevel: info
  logAllQueries: true
  slowQueryThresholdMs: 20
