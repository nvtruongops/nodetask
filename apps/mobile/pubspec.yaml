name: mobile
description: Flutter Mobile App for nodetask monorepo.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flex_color_scheme: ^7.3.1
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  serverpod_auth_shared_flutter: ^1.2.0
  client:
    path: ../client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
