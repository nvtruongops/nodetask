# ==============================================================================
# Page Route Document Specification Contract Schema (.agents/schemas/page-route-doc.yaml)
# Defines the mandatory structure and section validation contracts for all docs/page_routes/*.md files
# ==============================================================================

kind: page-route-doc-spec
version: 2

sections:
  "Overview & Route ID":
    minOccurrences: 1
    description: "Summary of page purpose, target audience, Route ID, and route_name."
    mustContain:
      - "Route ID"

  "Route Config & Navigation Metadata":
    minOccurrences: 1
    description: "URL path, access type, page archetype, layout shell, auth guard, and navigation flags."
    mustContain:
      - "Page Archetype"

  "SEO & Social Meta Specification":
    minOccurrences: 1
    description: "Page Title, Meta Description, Keywords, Canonical URL, OpenGraph, and Twitter Card specifications."
    mustContain:
      - "Title Tag"

  "Loading Strategy & Code Splitting":
    minOccurrences: 1
    description: "React Router loading strategy, lazy load, preload conditions, chunk name, and bundle priority."
    mustContain:
      - "Lazy Load"

  "Permission Matrix & RBAC":
    minOccurrences: 1
    description: "Explicit role-based access matrix mapping System Roles (GUEST, USER, ORG_MEMBER, ORG_ADMIN, SYSTEM_ADMIN)."
    mustContain:
      - "GUEST"
      - "USER"
      - "ORG_MEMBER"
      - "ORG_ADMIN"
      - "SYSTEM_ADMIN"

  "API Dependency & Serverpod RPC":
    minOccurrences: 1
    description: "Explicit Serverpod RPC signatures, endpoints called, cache TTL, and data flow."
    mustContain:
      - "Serverpod"

  "Page State Machine & UI Transitions":
    minOccurrences: 1
    description: "UI state diagram and transitions."
    mustContain:
      - "IDLE"

  "Component Inventory & Tree":
    minOccurrences: 1
    description: "List of atomic/molecule components and visual component tree hierarchy."
    mustContain:
      - "Required Pattern Components"
      - "Route Anti-Patterns"

  "Error Mapping & Handling":
    minOccurrences: 1
    description: "HTTP/RPC error status codes (401, 403, 404, 409, 422, 429, 500) mapped to UI error keys."
    mustContain:
      - "401"
      - "500"

  "Acceptance Criteria & QA Scenarios":
    minOccurrences: 1
    description: "Structured Given-When-Then Gherkin scenarios for QA testing."
    mustContain:
      - "Scenario:"
      - "Given"
      - "When"
      - "Then"

  "Accessibility":
    minOccurrences: 1
    description: "Web accessibility (a11y) rules, WAI-ARIA roles, focus management, and keyboard navigation."
    mustContain:
      - "WAI-ARIA"
