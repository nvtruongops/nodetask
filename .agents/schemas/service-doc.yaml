# ==============================================================================
# Service Document Specification Contract Schema (.agents/schemas/service-doc.yaml)
# Defines the mandatory structure and validation rules for all docs/services/*.md files
# ==============================================================================

kind: service-doc-spec
version: 2

# Declarative section validation rules
sections:
  Overview:
    minOccurrences: 1
    description: "High-level summary of service purpose and boundaries."
    mustContain: []

  Endpoints:
    minOccurrences: 1
    description: "Serverpod RPC Endpoint Class and Method signatures."
    mustContain:
      - "Session session"
    regexPatterns:
      - pattern: "[A-Z][a-Za-z0-9]+Endpoint\\.[a-zA-Z0-9]+\\(Session session"
        message: "Chữ ký Endpoint phải theo cú pháp Serverpod Dart: EndpointClass.method(Session session, Input input)"

  Request:
    minOccurrences: 1
    description: "Request DTOs, parameters, and input schemas."
    mustContain:
      - "interface"

  Response:
    minOccurrences: 1
    description: "Response payload contracts and data structures."
    mustContain:
      - "interface"

  Validation:
    minOccurrences: 1
    description: "Input validation constraints (Zod/Dart boundary rules)."
    mustContain: []

  Permissions:
    minOccurrences: 1
    description: "Role-Based Access Control (RBAC) and resource ownership matrix."
    mustContain:
      - "GUEST"
      - "USER"
      - "ORG_MEMBER"
      - "ORG_ADMIN"
      - "SYSTEM_ADMIN"

  Errors:
    minOccurrences: 1
    description: "Standardized error code constants and failure scenarios."
    mustContain:
      - "HTTP Status"
    regexPatterns:
      - pattern: "`[A-Z0-9_]+`"
        message: "Mã lỗi phải dạng hằng số viết hoa bọc trong backticks (ví dụ: `AUTH_INVALID_CREDENTIALS`)"

  Events:
    minOccurrences: 1
    description: "WebSocket and system events published by this service."
    regexPatterns:
      - pattern: "[a-z0-9_]+\\.[a-z0-9_]+"
        message: "Tên sự kiện Realtime phải có cấu trúc namespace.event_name (ví dụ: `auth.otp_sent`)"

  Cache:
    minOccurrences: 1
    description: "Redis cache keys, TTL, and invalidation rules."
    mustContain:
      - "TTL"
      - "Invalidation"

  Examples:
    minOccurrences: 1
    description: "Concrete Request and Response code examples."
    mustContain:
      - "```typescript"
